<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduled Tasks</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="max-w-4xl mx-auto py-10">
        <h1 class="text-4xl font-bold mb-6 text-center">Scheduled Tasks</h1>

        {% if scheduled %}
        <ul class="space-y-4">
            {% for task, start_time, end_time in scheduled %}
            <li class="bg-white p-4 rounded-lg shadow-md">
                <div class="font-bold text-lg">{{ task }}</div>
                <div>Start: {{ start_time }}</div>
                <div>End: {{ end_time }}</div>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p class="text-center text-gray-600">No tasks were scheduled.</p>
        {% endif %}

        <div class="mt-8 text-center">
            <a href="/" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded">Back to Home</a>
        </div>
    </div>
</body>
</html>
